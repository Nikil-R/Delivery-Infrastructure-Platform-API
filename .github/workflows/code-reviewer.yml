name: Agent Router Hub Code Reviewer

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Agent Router Hub Code Reviewer
        env:
          AGENT_ROUTER_HUB_URL: ${{ secrets.AGENT_ROUTER_HUB_URL || 'http://localhost:8000' }}
          AGENT_ROUTER_HUB_API_KEY: ${{ secrets.AGENT_ROUTER_HUB_API_KEY || 'am_live_kmoepx8epsmsw0lrsy' }}
        run: |
          echo "[Agent Router Hub] Auditing code changes for code-reviewer..."
          DIFF_DATA=$(git diff HEAD~1..HEAD --stat || echo "Initial commit or no parent")
          PAYLOAD=$(node -e 'console.log(JSON.stringify({ input: "Inspect commit changes:\n" + process.argv[1] }))' "$DIFF_DATA")
          curl -s -X POST "$AGENT_ROUTER_HUB_URL/v1/runs/code-reviewer" \
            -H "Authorization: Bearer $AGENT_ROUTER_HUB_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
